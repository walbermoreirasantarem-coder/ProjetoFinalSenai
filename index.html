      <div class="cardapio1">

          <img src="Imagens/prato.png" alt="">

<footer class="footer">

    <!-- Container que organiza as informações do rodapé -->
    <div class="footer-container">

        <!-- Primeira seção: endereço da empresa -->
        <div class="footer-info">
            <!-- Título da seção -->
            <h3>Endereço</h3>

            <!-- Parágrafo com o endereço -->
            <p>
                Rua Exemplo, 123<br>
                Rio de Janeiro - RJ
            </p>
        </div>

        <!-- Segunda seção: nome e identidade da empresa -->
        <div class="footer-logo">

            <!-- Nome da empresa -->
            <h2>Sabor da Casa</h2>

            <!-- Linha decorativa abaixo do nome -->

            <!-- Mensagem de carinho -->
            <p>
                Feito com carinho
                <!-- Ícone de coração -->
                <span class="heart">♥️</span>
            </p>
        </div>

        <!-- Terceira seção: informações de contato -->
        <div class="footer-info">

            <!-- Título da seção -->
            <h3>Contato</h3>

            <p>
                (21) 99999-9999<br>
                contato@sabordacasa.com
            </p>
        </div>

    </div>

        <!-- Texto de direitos reservados -->
        <p>
            © 2026 Sabor da Casa. Todos os direitos reservados.
        </p>

    </div>


</footer>
