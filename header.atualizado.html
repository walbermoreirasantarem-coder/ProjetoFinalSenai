<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="header.atualizado.css">

    <title>Sabor da Casa</title>
</head>

<body>

    <header id="cabecalho">

        <!-- LOGO -->
        <div id="logo">

            <img class="logo-icon" src="Imagens/05_chapeu_de_cozinha.png" alt="">

            <h1>
                <strong>Sabor</strong>
                <br>
                da Casa
            </h1>

        </div>


        <!-- MENU -->
        <nav>

            <a href="#">
                <img src="Imagens/04_cardapio.png" alt="">
                <span>Cardápio</span>
            </a>

            <a href="#">
                <img src="Imagens/02_promocoes_estrela.png" alt="">
                <span>Promoções</span>
            </a>

            <a href="#">
                <img src="Imagens/06_sobre_nos_talheres.png" alt="">
                <span>Sobre Nós</span>
            </a>

            <a href="#">
                <img src="Imagens/01_contato_localizacao.png" alt="">
                <span>Contato</span>
            </a>

        </nav>

        <form action="/buscar" method="GET" class="search-form">

            <label for="search-input" class="sr-only">
                Pesquisar no site
            </label>

            <input
                type="search"
                id="search-input"
                name="q"
                placeholder="Refeições"
            >

        </form>
        
        <!-- CARRINHO + PESQUISA -->
        <div class="acoes">

            <a id="carrinho" href="#">

                <img src="Imagens/03_carrinho.png" alt="" width="40px">

                <span id="contador-carrinho">0</span>

            </a>

        </div>

    </header>

</body>

</html>
